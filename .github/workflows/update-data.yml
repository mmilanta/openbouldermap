name: Daily data update

# Runs every day at 05:17 UTC (after Geofabrik publishes the fresh
# Switzerland extract) and manually via "Run workflow".
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium (preinstalled on most runners)
        run: |
          if ! command -v osmium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y osmium-tool
          fi
          osmium --version

      - name: Download planetiler
        run: curl -fLo planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar

      - name: Download Switzerland OSM extract
        run: |
          mkdir -p data
          curl -fLo data/switzerland.osm.pbf https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
          ls -lh data/switzerland.osm.pbf

      - name: Build climbing tiles
        run: bash scripts/build-climbing-tiles.sh data/switzerland.osm.pbf

      - name: Create or update PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: tiles/climbing.pmtiles
          commit-message: 'chore: update climbing tiles from daily Switzerland OSM extract'
          branch: data-update
          delete-branch: true
          title: 'chore: update climbing tiles'
          body: |
            Automated update of `tiles/climbing.pmtiles` from the latest
            [Geofabrik Switzerland extract](https://download.geofabrik.de/europe/switzerland.html).

            Generated by the daily data pipeline. Auto-merged when possible.

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          if ! gh pr merge --squash --auto "$PR" 2>/dev/null; then
            echo "::warning::Auto-merge is not enabled for this repo; merging immediately instead."
            gh pr merge --squash "$PR"
          fi

      - name: Wait for merge, then delete branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          STATE=""
          for i in $(seq 1 60); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/data-update" || true
              echo "PR #$PR merged."
              exit 0
            fi
            sleep 10
          done
          echo "::error::PR #$PR did not merge within 10 minutes (state: $STATE)." >&2
          exit 1

  # The merge is performed with GITHUB_TOKEN, so the push-to-main does NOT
  # trigger the normal deploy workflow (GitHub prevents GITHUB_TOKEN-triggered
  # workflows). Deploy here instead, right after the merge, so the site always
  # reflects the fresh tiles.
  deploy:
    needs: update
    if: needs.update.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
