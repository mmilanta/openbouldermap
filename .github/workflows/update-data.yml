name: Weekly worldwide data update

# OSM publishes a new full-planet PBF weekly. Run on Friday, after the dump is
# normally ready, and manually via "Run workflow".
on:
  schedule:
    - cron: '17 5 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: weekly-worldwide-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      pr-number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium (preinstalled on most runners)
        run: |
          if ! command -v osmium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y osmium-tool
          fi
          osmium --version

      - name: Set up Java 21 (planetiler requires >= 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download planetiler
        run: curl -fLo planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar

      # The planet PBF is about 95 GB. The build script streams it through
      # osmium and writes only the small climbing-only subset to disk.
      - name: Build worldwide climbing tiles
        run: bash scripts/build-climbing-tiles.sh https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf

      - name: Create or update PR
        id: cpr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Skip if the tiles did not change vs the base branch.
          if git diff --quiet HEAD -- tiles/climbing.pmtiles; then
            echo "No tile changes; nothing to commit."
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B data-update
          git add tiles/climbing.pmtiles
          git commit -m "chore: update worldwide climbing tiles from OSM planet dump"
          git push --force origin data-update

          if gh pr view data-update --json number --jq .number >/dev/null 2>&1; then
            PR_NUMBER="$(gh pr view data-update --json number --jq .number)"
            echo "PR already exists for branch data-update: #$PR_NUMBER"
          else
            echo "Creating pull request..."
            if ! PR_URL="$(gh pr create \
                --base master \
                --head data-update \
                --title "chore: update climbing tiles" \
                --body "Automated worldwide update of \`tiles/climbing.pmtiles\` from the latest OpenStreetMap planet dump." 2>/tmp/gh-pr-create.err)"; then
              cat /tmp/gh-pr-create.err >&2
              echo "::error::gh pr create failed. If the error is 403 / 'Resource not accessible by integration', enable 'Allow GitHub Actions to create and approve pull requests' in repo Settings -> Actions -> General -> Workflow permissions."
              exit 1
            fi
            PR_NUMBER="$(echo "$PR_URL" | grep -oE '[0-9]+$')"
            echo "Created PR #$PR_NUMBER"
          fi
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          if ! gh pr merge --squash --auto "$PR" 2>/dev/null; then
            echo "::warning::Auto-merge is not enabled for this repo; merging immediately instead."
            gh pr merge --squash "$PR"
          fi

      - name: Wait for merge, then delete branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          STATE=""
          for i in $(seq 1 60); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/data-update" || true
              echo "PR #$PR merged."
              exit 0
            fi
            sleep 10
          done
          echo "::error::PR #$PR did not merge within 10 minutes (state: $STATE)." >&2
          exit 1

  # The merge is performed with GITHUB_TOKEN, so the push-to-master does NOT
  # trigger the normal deploy workflow (GitHub prevents GITHUB_TOKEN-triggered
  # workflows). Deploy here instead, right after the merge, so the site always
  # reflects the fresh tiles.
  deploy:
    needs: update
    if: needs.update.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
