<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenBoulderMap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <aside id="sidebar" class="hidden">
        <button id="sidebar-close" title="Close">&times;</button>
        <div id="sidebar-content"></div>
      </aside>
      <div id="attribution">
        © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://github.com/mmilanta/openbouldermap" target="_blank" rel="noopener">GitHub</a> · <time id="tile-attribution-date">…</time><span id="satellite-attribution" hidden> · Satellite imagery © <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics, and the GIS User Community</span>
      </div>
      <div id="editor-controls" class="editor-controls">
        <button id="osc-toggle" class="edit-toggle osc-toggle" type="button" title="Download OSM changefile" hidden>
          <span class="osc-label">⬇ Download .osc</span>
          <span id="osc-count" class="osc-count">0</span>
        </button>
        <button id="edit-toggle" class="edit-toggle" type="button" title="Edit OSM data" aria-label="Edit OSM data">✎</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
