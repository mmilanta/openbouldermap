<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenBoulderMap</title>
    <script>
      // GitHub Pages has no SPA fallback, so a direct visit to
      // /edit would otherwise return 404. This page redirects the missing
      // /edit route to the app while preserving the map hash. It also sends a
      // slash-less /wiki to the wiki's index page.
      (function () {
        var base = '/'
        var root = base.replace(/\/+$/, '')
        var path = window.location.pathname.replace(/\/+$/, '')
        var hash = window.location.hash || ''
        var target = window.location.origin + base + hash

        if (path === root + '/edit') {
          target = window.location.origin + base + '?edit=1' + hash
        }

        if (path === root + '/wiki') {
          target = window.location.origin + base + 'wiki/' + hash
        }

        window.location.replace(target)
      })()
    </script>
  </head>
  <body>
    Redirecting to the editor…
  </body>
</html>
