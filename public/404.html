<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenBoulderMap</title>
    <script>
      // GitHub Pages has no SPA fallback, so a direct visit to
      // /openbouldermap/edit would otherwise return 404. This page redirects
      // the missing /edit route to the app while preserving the map hash.
      (function () {
        var base = '/openbouldermap/'
        var root = base.replace(/\/+$/, '')
        var path = window.location.pathname.replace(/\/+$/, '')
        var hash = window.location.hash || ''
        var target = window.location.origin + base + hash

        if (path === root + '/edit') {
          target = window.location.origin + base + '?edit=1' + hash
        }

        window.location.replace(target)
      })()
    </script>
  </head>
  <body>
    Redirecting to the editor…
  </body>
</html>
