schema_name: openbouldermap-climbing
schema_description: 'OpenBoulderMap — climbing features (boulders + routes), derived from OpenStreetMap.'
attribution: '&copy; OpenStreetMap contributors'

# Three precomputed GeoJSON inputs are produced by scripts/build-hierarchy.py:
#   data/sectors.geojson — area + sector centroid points, carrying `rank`
#   data/boulders.geojson — physical rock geometry linked to its sector
# The raw OSM PBF supplies the problem points.
sources:
  osm:
    type: osm
    local_path: data/climbing-filtered.osm.pbf
  sector_sites:
    type: geojson
    local_path: data/sectors.geojson
  rocks:
    type: geojson
    local_path: data/boulders.geojson

tag_mappings:
  'climbing:grade:font': string
  'climbing:grade:hueco': string
  'climbing:grade:fb': string
  'climbing:grade:uiaa': string
  'climbing:grade:french': string
  'climbing:grade:saxon': string
  'climbing:grade:polish': string
  'climbing:grade:yds_class': string
  'climbing:grade:norwegian': string
  'climbing:start': string
  'climbing:fa': string
  'climbing:length': integer
  'climbing:boulder': string
  wikimedia_commons: string
  'wikimedia_commons:path': string
  'wikimedia_commons:2': string
  'wikimedia_commons:2:path': string

layers:

  # ---- areas: nested bouldering areas, shown as floating names only ----
  # `band` counts from the deepest area level (0 = deepest) and drives the zoom
  # band a name may appear in (styled in src/style.ts); the viewer side is
  # label-only, so these are centroid points.
  - id: areas
    features:
      - source: sector_sites
        geometry: point
        min_zoom: 2
        include_when:
          climbing: area
        attributes:
          - { key: name, tag_value: name }
          - { key: kind, tag_value: kind }
          - { key: osm_type, tag_value: osm_type }
          - { key: osm_id, tag_value: osm_id, type: long }
          - { key: rank, tag_value: rank, type: integer }
          - { key: band, tag_value: band, type: integer }
          - { key: area_count, tag_value: area_count, type: integer }
          - { key: sector_count, tag_value: sector_count, type: integer }

  # ---- sectors: the boulders (climbing=crag + climbing:boulder=yes) ----
  - id: sectors
    features:
      - source: sector_sites
        geometry: point
        min_zoom: 12
        include_when:
          climbing: crag
        attributes:
          - { key: name, tag_value: name }
          - { key: kind, tag_value: kind }
          - { key: osm_type, tag_value: osm_type }
          - { key: osm_id, tag_value: osm_id, type: long }
          - { key: rank, tag_value: rank, type: integer }
          - { key: problem_count, tag_value: problem_count, type: integer }
          - { key: has_rock, tag_value: has_rock, type: integer }

  # ---- physical rock: polygons (sector = owning boulder, -1 if none) ----
  - id: boulders
    features:
      - source: rocks
        geometry: polygon
        min_zoom: 12
        include_when:
          osm_type: [node, way, relation]
        attributes:
          - { key: name, tag_value: name }
          - { key: sector, tag_value: sector, type: long }
          - { key: osm_type, tag_value: osm_type }
          - { key: osm_id, tag_value: osm_id, type: long }

  # ---- physical rock: point markers ----
  - id: boulder_points
    features:
      - source: rocks
        geometry: point
        min_zoom: 12
        include_when:
          osm_type: [node, way, relation]
        attributes:
          - { key: name, tag_value: name }
          - { key: sector, tag_value: sector, type: long }
          - { key: osm_type, tag_value: osm_type }
          - { key: osm_id, tag_value: osm_id, type: long }

  # ---- routes: climbing=route_bottom points ----
  - id: routes
    features:
      - source: osm
        geometry: point
        min_zoom: 13
        include_when:
          climbing: route_bottom
        attributes:
          - { key: name, tag_value: name }
          - { key: 'climbing:grade:font', tag_value: 'climbing:grade:font' }
          - { key: 'climbing:grade:hueco', tag_value: 'climbing:grade:hueco' }
          - { key: 'climbing:grade:fb', tag_value: 'climbing:grade:fb' }
          - { key: 'climbing:grade:uiaa', tag_value: 'climbing:grade:uiaa' }
          - { key: 'climbing:grade:french', tag_value: 'climbing:grade:french' }
          - { key: 'climbing:grade:saxon', tag_value: 'climbing:grade:saxon' }
          - { key: 'climbing:grade:polish', tag_value: 'climbing:grade:polish' }
          - { key: 'climbing:grade:yds_class', tag_value: 'climbing:grade:yds_class' }
          - { key: 'climbing:grade:norwegian', tag_value: 'climbing:grade:norwegian' }
          - { key: 'climbing:start', tag_value: 'climbing:start' }
          - { key: description, tag_value: description }
          - { key: 'climbing:fa', tag_value: 'climbing:fa' }
          - { key: 'climbing:length', tag_value: 'climbing:length', type: integer }
          - { key: url, tag_value: url }
          - { key: wikimedia_commons, tag_value: wikimedia_commons }
          - { key: 'wikimedia_commons:path', tag_value: 'wikimedia_commons:path' }
          - { key: image, tag_value: image }
          - { key: osm_type, value: '${ feature.osm_type }' }
          - { key: osm_id, value: '${ feature.id }', type: long }
